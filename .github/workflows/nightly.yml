# Nightly CI (OPS-05) — docs/08-operations.md §8.3.2, WP-01 card scope
# (dependency audit + docs links now; the full nightly matrix arrives with
# its owning work packages). Two schedule entries with per-job guards
# implement the daily audit and the weekly, informational link check
# (research D10; documented in docs/08 §8.3.2, G-19).
name: Nightly CI

on:
  schedule:
    - cron: "17 2 * * *" # daily — dependency audit
    - cron: "27 2 * * 0" # weekly (Sundays) — docs links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  docs-links:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '27 2 * * 0'
    runs-on: ubuntu-latest
    continue-on-error: true # informational (docs/08 §8.3.2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "docs/**/*.md"
