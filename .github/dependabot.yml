# Dependabot update proposal cadence — docs/05-security.md §5.6 rule 5
# (weekly for cargo, npm, and actions), WP-01 card.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # rusqlite is pinned to 0.41.x by docs/00 s0.8 (G-11); minor
      # proposals (0.42+) need a baseline change first.
      - dependency-name: rusqlite
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
