[package]
name = "afterleads-video-spirits"
version = "0.1.0"
description = "AfterLeads-Video-Spirits app backend (CMP-12, docs/02 §2.4)"
authors = ["AfterLeads"]
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "afterleads_video_spirits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
alvs-core = { path = "../../crates/alvs-core" }
alvs-model = { path = "../../crates/alvs-model" }
alvs-store = { path = "../../crates/alvs-store" }
