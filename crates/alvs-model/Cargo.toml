[package]
name = "alvs-model"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
alvs-core = { path = "../alvs-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
thiserror = "=2.0.21"
uuid = { version = "=1.29.0", features = ["v7"] }

[dev-dependencies]
proptest = "=1.12.0"

[lints]
workspace = true
