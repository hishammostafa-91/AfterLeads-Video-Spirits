[package]
name = "alvs-store"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
alvs-core = { path = "../alvs-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uuid = { version = "=1.29.0", features = ["v7"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "time"] }
tracing-appender = "=0.2.5"
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
alvs-model = { path = "../alvs-model" }

[lints]
workspace = true
